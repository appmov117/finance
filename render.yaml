services:
  - type: web
    name: finance
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: ADMIN_NAME
        value: Administradora
      - key: CONTRACT_CITY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: TIMEZONE
        value: America/Mexico_City
